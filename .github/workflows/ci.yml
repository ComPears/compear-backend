name: Backend CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Data syncs are published by wrangling; don't fail app CI on catalog churn.
      - 'src/data/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'src/data/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: compears_test
          POSTGRES_PASSWORD: ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        env:
          INSIGHTS_TEST_DATABASE_URL: postgresql://postgres:ci-fixture-only@127.0.0.1:5432/compears_test
        run: npm test

      - name: Audit locked dependencies
        run: npm audit

      - name: Build backend
        run: npm run build

      - name: Enforce Render memory budget with real catalogs and concurrent requests
        run: npm run test:memory
