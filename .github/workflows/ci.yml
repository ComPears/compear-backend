name: Backend CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Data syncs are published by wrangling; don't fail app CI on catalog churn.
      - 'src/data/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'src/data/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Enforce Render memory budget with real catalogs and concurrent requests
        run: npm run test:memory
