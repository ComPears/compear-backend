name: Seed backend product data

# Pull published catalogs from compears-data-wrangling into backend src/data.
# Primary sync path (uses this repo's GITHUB_TOKEN — no cross-repo PAT required).
# Daily scrapers publish at 00:00 UTC; seed runs shortly after.

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout data-wrangling
        uses: actions/checkout@v7
        with:
          repository: ComPears/compears-data-wrangling
          ref: main
          path: compears-data-wrangling
          fetch-depth: 1
          # Public wrangling repo is readable with github.token; optional PAT for private forks.
          token: ${{ secrets.WRANGLING_REPO_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Seed all stores from data-wrangling
        env:
          WRANGLING_PATH: ${{ github.workspace }}/compears-data-wrangling
          COUNTRY: nl,uk,de
        run: npm run seed

      # Best-effort: Overpass is flaky (504s). Product seed must still commit/deploy.
      - name: Import store locations from OpenStreetMap
        id: osm_import
        continue-on-error: true
        run: npm run import-stores

      - name: Upload seeded data artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-product-data
          path: |
            src/data/nl/*.json
            src/data/uk/*.json
            src/data/de/*.json
            src/data/store-locations.json
          retention-days: 14

      - name: Commit seeded product data
        id: backend_commit
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/nl src/data/uk src/data/de
          if [ -f src/data/store-locations.json ]; then
            git add src/data/store-locations.json
          fi
          if git diff --cached --quiet; then
            echo "No product data changes to commit"
          else
            git commit -m "chore: weekly seed from data-wrangling $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
          if [ "${{ steps.osm_import.outcome }}" != "success" ]; then
            echo "::warning::OSM store import failed; kept previous store-locations.json and continued product seed deploy."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger Render backend redeploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping Render redeploy"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook triggered"

      - name: Verify expected backend revision readiness
        continue-on-error: true
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || vars.BACKEND_URL }}
          EXPECTED_COMMIT: ${{ steps.backend_commit.outputs.sha }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "::warning::BACKEND_BASE_URL not set; skipping readiness probe"
            exit 0
          fi

          health_url="${BACKEND_BASE_URL%/}/health/ready"
          for attempt in $(seq 1 60); do
            if payload=$(curl -fsS --max-time 15 "$health_url"); then
              deployed_commit=$(echo "$payload" | jq -r '.deployment.commit // empty')
              if [ "$deployed_commit" = "$EXPECTED_COMMIT" ]; then
                echo "$payload" | tee readiness.json
                echo "### Backend readiness" >> "$GITHUB_STEP_SUMMARY"
                echo '```json' >> "$GITHUB_STEP_SUMMARY"
                echo "$payload" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Readiness attempt $attempt/60 reached ${deployed_commit:-unknown}; waiting for $EXPECTED_COMMIT"
            else
              echo "Readiness attempt $attempt/60 failed; waiting for deployment..."
            fi
            sleep 10
          done

          echo "::warning::Backend revision $EXPECTED_COMMIT did not become ready at $health_url within 10 minutes."
          exit 0
