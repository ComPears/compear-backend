name: Monitor production backend

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check liveness and readiness
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || vars.BACKEND_URL }}
          # Metrics require ADMIN_API_KEY or SCRAPE_API_KEY (x-api-key)
          METRICS_API_KEY: ${{ secrets.ADMIN_API_KEY || secrets.SCRAPE_API_KEY }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "::error::Set BACKEND_BASE_URL (or BACKEND_URL) repository variable to enable production monitoring."
            exit 1
          fi

          base_url="${BACKEND_BASE_URL%/}"
          if ! curl -fsS --retry 2 --retry-delay 5 --max-time 20 "$base_url/health/live" -o live.json; then
            echo "::error::Backend liveness failed at $base_url/health/live. Check the Render service and application logs."
            exit 1
          fi
          if ! curl -fsS --retry 2 --retry-delay 5 --max-time 20 "$base_url/health/ready" -o ready.json; then
            echo "::error::Backend readiness failed at $base_url/health/ready. Check catalog load/freshness and RSS details in the response or Render logs."
            curl -sS --max-time 20 "$base_url/health/ready" || true
            exit 1
          fi
          if [ -z "$METRICS_API_KEY" ]; then
            echo "::warning::ADMIN_API_KEY/SCRAPE_API_KEY secret not set — skipping authenticated /health/metrics."
            echo '{"skipped":true,"reason":"missing metrics API key"}' > metrics.json
          else
            curl -fsS --max-time 20 -H "x-api-key: $METRICS_API_KEY" "$base_url/health/metrics" -o metrics.json
          fi

          {
            echo "## Production backend health"
            echo
            echo "Readiness:"
            echo '```json'
            cat ready.json
            echo
            echo '```'
            echo
            echo "Runtime metrics (startup, memory, requests, searches):"
            echo '```json'
            cat metrics.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
